# praxis-docs — GitLab CI + Pages deploy
# Permanent URL (unique domain): https://praxis-docs-e263c2.pages.jetru.by
# VitePress base must stay "/" while unique domain is enabled.
stages:
  - verify
  - deploy

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - node -v && npm -v
    - npm ci --cache .npm --prefer-offline

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Documented for operators; unique-domain Pages serve at site root.
  PRAXIS_DOCS_PAGES_URL: "https://praxis-docs-e263c2.pages.jetru.by"

build_docs:
  stage: verify
  script:
    - npm run docs:build
    - npm run accept:docs
    - test -f apps/docs-site/.vitepress/dist/index.html
  artifacts:
    paths:
      - apps/docs-site/.vitepress/dist/
    expire_in: 1 hour

pages:
  stage: deploy
  needs:
    - job: build_docs
      artifacts: true
  script:
    - test -f apps/docs-site/.vitepress/dist/index.html
    - mkdir -p public
    - cp -R apps/docs-site/.vitepress/dist/. public/
    - |
      python3 - <<'PY'
      import hashlib, json, pathlib
      files = sorted(p for p in pathlib.Path("public").rglob("*") if p.is_file())
      assert files, "empty docs site"
      sample = [{"file": str(p), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size} for p in files[:40]]
      pathlib.Path("dist-docs-checksums.json").write_text(json.dumps({"fileCount": len(files), "sample": sample}, indent=2) + "\n")
      print("files", len(files))
      print("pages_url", "https://praxis-docs-e263c2.pages.jetru.by")
      PY
  artifacts:
    paths:
      - public
      - dist-docs-checksums.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: pages
    url: https://praxis-docs-e263c2.pages.jetru.by
